# Type-check, test and build on every pull request (deploy.yaml only runs on main).
name: CI

on:
  pull_request:

# This job only reads the tree—it never pushes, comments or deploys.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: build.test.ts dates the feeds and the sitemap from
          # git, and in a shallow clone those assertions pass vacuously on
          # zero entries—a broken lookup would stay invisible in this gate.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Exact version (not a range) so CI runs are reproducible; bump deliberately.
          bun-version: "1.3.14"

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build (includes type check)
        run: bun run build
