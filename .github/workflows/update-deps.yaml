# Daily dependency refresh. `bun update --latest` deliberately goes PAST the
# package.json ranges: it rewrites the ranges themselves, so a dependency can
# cross a major here (pretext and tsgo both can). That is the intent—this repo
# tracks four dependencies and would rather see a breaking bump fail loudly in
# CI than sit on a stale tree—but it means the only thing between a published
# major and `main` is the test suite below. When something changed, the full
# suite (typecheck + real build included) gates the commit, so a broken bump
# never lands.
#
# The cron fires at midnight Shanghai, not UTC: `timezone:` is a real key on
# `schedule` (shipped March 2026). Do not "helpfully" hand-convert it to UTC.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so this job
# dispatches deploy.yaml itself after pushing—without that the site would
# stay on the old dependencies until the next manual push.
name: Update dependencies

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Shanghai"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Push the lockfile commit (contents) and dispatch deploy.yaml (actions).
permissions:
  contents: write
  actions: write

# Never two updates at once; a queued run waits for the in-progress one.
concurrency:
  group: "update-deps"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: this job's `bun test` is the only gate between a
          # dependency bump and main, and the feed/sitemap date assertions in
          # build.test.ts pass vacuously in a shallow clone.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Exact version (not a range) so runs are reproducible; bump deliberately.
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Update dependencies
        run: bun update --latest

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- bun.lock package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- bun.lock package.json
          fi

      - name: Test (includes type check and a full build)
        if: steps.diff.outputs.changed == 'true'
        run: bun test

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          git commit -m "chore: bun update ($(date -u +%F))"
          git push

      - name: Deploy the updated site
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml --ref main
